<!DOCTYPE html>
<html>
  <head>
    <!-- VIEWPORT -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- GOOGLE FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet" />

    <!-- FONTAWESOME -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- STYLESHEET-->
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="wrapper">
      <header>
        <h1 class="title">COLOR SCHEME GENERATOR</h1>

        <form id="color-form" class="form-color">
          <input type="color" name="color" id="input-color" class="input-color" />
          <select name="scheme" id="select-scheme" class="select-scheme">
            <option value="monochrome">Monochrome</option>
            <option value="monochrome-dark">Monochrome-dark</option>
            <option value="monochrome-light">Monochrome-light</option>
            <option value="analogic">Analogic</option>
            <option value="complement">Complement</option>
            <option value="analogic-complement">Analogic-complement</option>
            <option value="triad">Triad</option>
            <option value="quad">Quad</option>
          </select>
          <button type="submit" id="submit-btn" class="submit-btn">Get color scheme</button>
          <div class="toggle-container">
            <input type="checkbox" id="darkmode" class="toggle-input" />
            <label for="darkmode" class="toggle-btn">
              <i class="fa-solid fa-sun"></i>
              <i class="fa-solid fa-moon"></i>
            </label>
          </div>
        </form>
      </header>

      <main>
        <div id="colors" class="colors-wrapper"></div>
      </main>
    </div>

    <script src="index.js"></script>
  </body>
</html>
